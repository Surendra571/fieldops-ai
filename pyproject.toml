[project]
name = "fieldops-ai"
version = "0.1.0"
description = "FieldOps AI — Production-minded voice-based field service management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.0.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.2",
    "tzdata>=2024.1",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "certifi>=2024.7.4",
    "dnspython>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mongomock-motor>=0.0.35",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "UP042", # str, Enum inheritance
    "UP046", # Generic class type parameters
    "E501", # line length
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
