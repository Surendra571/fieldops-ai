name: FieldOps AI CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-lint:
    name: Backend Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  backend-tests:
    name: Backend Test Suite & AI Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Pytest Test Suite
        run: pytest -v --tb=short

      - name: Run AI Agent Evaluation Benchmark
        run: python tests/evaluation/run_eval.py

  frontend-tests-and-build:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Vitest Suite
        run: npm test

      - name: Run TypeScript Typecheck & Production Vite Build
        run: npm run build

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend-tests-and-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Container
        run: docker build -t fieldops-backend:ci .

      - name: Build Frontend Container
        run: docker build -t fieldops-frontend:ci ./frontend

